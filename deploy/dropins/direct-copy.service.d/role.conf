[Service]
# DIRECT_ROLE=all (было web): при роли web _job_new публиковал copy-джобу в БД, и её забирал
# direct-create-worker (чужой процесс нейродиректолога) — со своим кэшем модуля direct_copy и
# без обновления in-memory статуса, из-за чего /api/copy_status вечно показывал queued.
# Роль all: постановка идёт в in-memory очередь этого процесса, её берут его же воркеры
# (_ensure_copy_worker), статус обновляется здесь же. Требование Семёна 2026-07-17:
# «задачу копирования должен выполнять direct-copy.service».
Environment=DIRECT_ROLE=all
