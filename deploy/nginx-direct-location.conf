# Put these before the generic / location in the seoadvanced.ru server block.
# Content editor has its own process so it can be restarted independently from
# campaign creation in direct-create.service.
location ^~ /direct/automation/content {
    proxy_pass http://127.0.0.1:5021;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location ^~ /direct/api/content-editor/ {
    proxy_pass http://127.0.0.1:5021;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Campaign-copy service (own process → own queue, restart-isolated from create-set).
# Its page + copy_* APIs go to 5022; всё прочее (/direct/api/accounts, /goal_for_counter,
# /automation) падает в общий /direct/ ниже → 5020 (общая сессия по одному secret).
location ^~ /direct/automation/copy {
    proxy_pass http://127.0.0.1:5022;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location ^~ /direct/api/copy_ {
    proxy_pass http://127.0.0.1:5022;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# No trailing slash in proxy_pass: `/direct/...` must reach the Direct blueprint
# unchanged.
location /direct/ {
    proxy_pass http://127.0.0.1:5020;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
