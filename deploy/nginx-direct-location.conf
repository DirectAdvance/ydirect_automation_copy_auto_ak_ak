# Put these locations before the generic / location in the seoadvanced.ru server block.
# No trailing slash in proxy_pass: /direct/... must reach each Flask blueprint unchanged.

# Direct content editor lives in a separate Flask process.
location ^~ /direct/automation/content {
    proxy_pass http://127.0.0.1:5021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location ^~ /direct/api/content-editor/ {
    # Вкладка «Смена изображений» шлёт multipart-загрузку картинки; бэкенд
    # (content_images_routes._MAX_BYTES) допускает до 40 МБ на запрос — без этой
    # директивы nginx откатывался к дефолту 1m и рубил upload раньше Flask (413).
    client_max_body_size 50m;
    client_body_timeout 120s;
    proxy_pass http://127.0.0.1:5021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Campaign-copy service (own process 5022 -> own queue, restart-isolated from create-set).
# Page + copy_* APIs to 5022; everything else (/direct/api/accounts, /goal_for_counter,
# /automation) falls through to the generic /direct/ below -> 5020 (shared session).
location ^~ /direct/automation/copy {
    proxy_pass http://127.0.0.1:5022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location ^~ /direct/api/copy_ {
    client_max_body_size 256m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:5022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Programmatic copy API (external clients, X-API-Key, fail-closed).
location ^~ /api/v1/copy/ {
    client_max_body_size 1m;
    client_body_timeout 30s;
    proxy_pass http://127.0.0.1:5022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

